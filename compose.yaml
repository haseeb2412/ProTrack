# Runs the API and web client together with Docker Compose.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      # Keep database credentials and JWT secrets in the local backend env file.
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:8080
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser calls the API through the host-published port.
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "8080:80"
    depends_on:
      - backend
