# Run the project's checks whenever code is pushed or a pull request is opened.
name: ProTrack CI

on:
  push:
  pull_request:

jobs:
  # Check the backend TypeScript code and lint rules.
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Prisma reads these variables while generating its client. CI does not connect to a database.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/protrack?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/protrack?schema=public
    steps:
      # Download the repository contents onto the GitHub runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # Install the Node.js version used by the backend.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install exactly the dependencies recorded in the lockfile.
      - name: Install backend dependencies
        # Skip npm's optional audit/funding network calls and show install scripts in the job log.
        run: npm ci --no-audit --no-fund --foreground-scripts

      # Generate Prisma Client so TypeScript can resolve the database types.
      - name: Generate Prisma Client
        run: npm run prisma:generate

      # Catch TypeScript and lint errors before changes are merged.
      - name: Type-check backend
        run: npm run typecheck

      - name: Lint backend
        run: npm run lint

  # Check that the frontend passes linting and can produce a production build.
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        # Skip npm's optional audit/funding network calls and show install scripts in the job log.
        run: npm ci --no-audit --no-fund --foreground-scripts

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
